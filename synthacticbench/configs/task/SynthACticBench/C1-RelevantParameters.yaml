# @package _global_
benchmark_id: SynthACticBench
task_id: ${task.name}
task:
  _target_: carps.utils.task.Task
  name: RelevantParameters
  seed: ${seed}
  objective_function:
    _target_: synthacticbench.synthacticbench_problem.SynthACticBenchProblem
    function:
      _target_: synthacticbench.configuration_space_functions.RelevantParameters
      dim: 10
      num_quadratic: 3
      seed: 52
  input_space:
    _target_: carps.utils.task.InputSpace
    configuration_space:
      _target_: ConfigSpace.configuration_space.ConfigurationSpace.from_serialized_dict
      _convert_: object
      d:
        name: null
        hyperparameters:
        - type: uniform_float
          name: n_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: n_1
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: n_2
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: n_3
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: n_4
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: n_5
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: n_6
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: x_1
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: x_2
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        conditions: []
        forbiddens: []
        python_module_version: 1.2.0
        format_version: 0.4
    fidelity_space:
      _target_: carps.utils.task.FidelitySpace
      is_multifidelity: false
      fidelity_type: null
      min_fidelity: null
      max_fidelity: null
    instance_space: null
  output_space:
    _target_: carps.utils.task.OutputSpace
    n_objectives: 1
    objectives:
    - quality
  optimization_resources:
    _target_: carps.utils.task.OptimizationResources
    n_trials: 100
    time_budget: null
    n_workers: 1
  metadata:
    _target_: carps.utils.task.TaskMetadata
    has_constraints: false
    domain: synthetic
    objective_function_approximation: real
    has_virtual_time: false
    deterministic: false
    dimensions: 10
    search_space_n_categoricals: 0
    search_space_n_ordinals: 0
    search_space_n_integers: 0
    search_space_n_floats: 10
    search_space_has_conditionals: false
    search_space_has_forbiddens: false
    search_space_has_priors: false
