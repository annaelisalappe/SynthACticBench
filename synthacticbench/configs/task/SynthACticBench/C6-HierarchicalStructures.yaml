# @package _global_
benchmark_id: SynthACticBench
task_id: ${task.name}
task:
  _target_: carps.utils.task.Task
  name: HierarchicalStructures
  seed: ${seed}
  objective_function:
    _target_: synthacticbench.synthacticbench_problem.SynthACticBenchProblem
    function:
      _target_: synthacticbench.configuration_space_functions.HierarchicalStructures
      dim: 10
      groups: 3
      subgroups_per_group: 2
      seed: 52
  input_space:
    _target_: carps.utils.task.InputSpace
    configuration_space:
      _target_: ConfigSpace.configuration_space.ConfigurationSpace.from_serialized_dict
      _convert_: object
      d:
        name: null
        hyperparameters:
        - type: uniform_float
          name: 0:0:x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 0:0:x_1
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 0:1:x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 1:0:x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 1:0:x_1
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 1:1:x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 2:0:x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: uniform_float
          name: 2:1:x_0
          lower: -100.0
          upper: 100.0
          default_value: 0.0
          log: false
          meta: null
        - type: categorical
          name: group
          choices:
          - 0
          - 1
          - 2
          weights: null
          default_value: 0
          meta: null
        - type: categorical
          name: subgroup
          choices:
          - 0
          - 1
          weights: null
          default_value: 0
          meta: null
        conditions: []
        forbiddens: []
        python_module_version: 1.2.0
        format_version: 0.4
    fidelity_space:
      _target_: carps.utils.task.FidelitySpace
      is_multifidelity: false
      fidelity_type: null
      min_fidelity: null
      max_fidelity: null
    instance_space: null
  output_space:
    _target_: carps.utils.task.OutputSpace
    n_objectives: 1
    objectives:
    - quality
  optimization_resources:
    _target_: carps.utils.task.OptimizationResources
    n_trials: 100
    time_budget: null
    n_workers: 1
  metadata:
    _target_: carps.utils.task.TaskMetadata
    has_constraints: false
    domain: synthetic
    objective_function_approximation: real
    has_virtual_time: false
    deterministic: true
    dimensions: 10
    search_space_n_categoricals: 0
    search_space_n_ordinals: 0
    search_space_n_integers: 0
    search_space_n_floats: 10
    search_space_has_conditionals: true
    search_space_has_forbiddens: false
    search_space_has_priors: false
